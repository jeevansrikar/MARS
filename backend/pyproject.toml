[project]
name = "mars-backend"
version = "2.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["requires_embedding_model: requires provisioned pinned local embedding assets", "integration: requires PostgreSQL and Redis", "requires_postgres: requires PostgreSQL with pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]

