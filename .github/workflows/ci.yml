name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mars_test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: mars_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mars_test -d mars_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      ENVIRONMENT: testing
      RUN_EMBEDDING_TESTS: '1'
      TEST_DATABASE_URL: postgresql+asyncpg://mars_test:ci-only-ephemeral-password@127.0.0.1:5432/mars_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      DATABASE_URL: postgresql+asyncpg://mars_test:ci-only-ephemeral-password@127.0.0.1:5432/mars_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m app.providers.embeddings --download
      - run: ruff format --check app tests migrations
      - run: ruff check app tests migrations
      - run: mypy app
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head && alembic downgrade base
      - run: pytest -q -p no:cacheprovider --junitxml=test-results/backend.xml
      - run: pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-results, path: backend/test-results}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: frontend/test-results}
  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d --wait postgres redis api frontend worker
      - run: curl --fail http://127.0.0.1:8000/live && curl --fail http://127.0.0.1:3000/
      - run: >-
          python -c "import urllib.request; h=urllib.request.urlopen('http://127.0.0.1:3000/').headers;
          assert h.get('Content-Security-Policy') and h.get('X-Content-Type-Options') == 'nosniff';
          assert h.get('Cache-Control') == 'no-cache'"
      - run: docker compose exec -T api alembic current
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL mars-api
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL mars-frontend
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
