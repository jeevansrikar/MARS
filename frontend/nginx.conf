limit_req_zone $binary_remote_addr zone=mars_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mars_clients:10m;
map $uri $mars_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    server_tokens off;
    # Structured application logs omit private query strings; do not duplicate
    # the default nginx access log, which includes the complete request URI.
    access_log off;
    add_header Cache-Control $mars_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        limit_req zone=mars_api burst=20 nodelay;
        limit_conn mars_clients 20;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
